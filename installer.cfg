; installer.cfg - Cấu hình pynsist tạo installer Windows cho KhoPhongCanHo
; Build: python -m nsist installer.cfg

[Application]
name=KhoPhongCanHo
version=1.0.0
publisher=Tú Nguyễn Land
script=custom_launch.pyw
icon=resources/icon.ico
license_file=LICENSE.txt

[Python]
version=3.12.0
bitness=64

[Include]
pypi_wheels =
    shiboken6==6.12.0
    openpyxl==3.1.2
    google-api-python-client==2.201.0
    google-auth==2.62.0
    google-auth-httplib2==0.4.4
    httplib2==0.22.0
    requests==2.32.3
    pytz==2024.1
packages =
    PySide6
files=main.py
    config.py
    database.py
    logger.py
    theme.py
    models.py
    text_utils.py
    inventory_manager.py
    duplicate_checker.py
    excel_import.py
    excel_export.py
    media_manager.py
    media_panel.py
    grouped_table.py
    sync_queue.py
    search_engine.py
    request_parser.py
    request_dialog.py
    import_dialog.py
    export_dialog.py
    edit_form.py
    building_view.py
    room_view.py
    customer_manager.py
    customer_view.py
    dashboard.py
    quick_add.py
    google_sheets.py
    google_drive.py
    settings.py
    main_window.py
    samples/Kho_Hang_Phong_Trong_Co_Phuong.xlsx
    app_entry.py
    custom_launch.pyw

[Build]
directory=build_nsis_new

[Shortcut KhoPhongCanHo]
entry_point=app_entry:main